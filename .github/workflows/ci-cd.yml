name: CI/CD Flutter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  # ---------- 1. Analyse statique ----------
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

  # ---------- 2. Tests ----------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ---------- 3. Build Web ----------
  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - run: flutter pub get

      # Recrée le .env à partir des secrets GitHub (jamais commité dans le repo)
      - name: Create .env file
        run: |
          echo "DISCOGS_TOKEN=${{ secrets.DISCOGS_TOKEN }}" >> .env

      # ⚠️ adapte --base-href si le nom du repo n'est pas "MCV"
      - name: Build web
        run: flutter build web --release --base-href "/MCV/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ---------- 4. Deploy GitHub Pages ----------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build_web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4