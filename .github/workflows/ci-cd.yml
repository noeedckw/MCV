name: CI/CD Flutter

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  # ---------- Build Web + Android + Landing page ----------
  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - run: flutter pub get

      # Recrée le .env à partir des secrets GitHub (jamais commité dans le repo)
      - name: Create .env file
        run: |
          echo "DISCOGS_TOKEN=${{ secrets.DISCOGS_TOKEN }}" >> .env

      - name: Build web
        run: flutter build web --release --base-href "/MCV/"

      # NOUVEAU : APK Android, packagée dans le même artefact que le site,
      # pour que la vitrine puisse proposer un lien de téléchargement direct.
      # Signée avec la clé de debug par défaut de Flutter (suffisant pour une
      # installation "sideload" hors Play Store) — remplacer par une vraie
      # config de signature si l'app doit un jour aller sur le Play Store.
      - name: Build Android APK
        run: flutter build apk --release

      - name: Assemble Pages output
        run: |
          mkdir -p build/web/downloads
          cp build/app/outputs/flutter-apk/app-release.apk build/web/downloads/mcv.apk
          mkdir -p build/web/landing
          cp -r mcv_landing_page/. build/web/landing/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ---------- Deploy GitHub Pages ----------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build_web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4