name: mcv
description: "My Collection of Vinyl - An application to manage your vinyl collection."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  http: ^1.2.2
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  connectivity_plus: ^6.0.5
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  idb_shim: ^2.6.3+2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/mcv_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/mcv_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home_page/
    - assets/images/search/
    - assets/images/error/
    - assets/images/setup/