<body>
  <script>
    // Fonction exposée à Dart (appelée uniquement depuis un vrai tap
    // utilisateur, via l'écran de démarrage Flutter). Force un vrai
    // cycle ouverture/fermeture du clavier iOS, ce qui corrige le
    // décalage de hit-test propre au mode PWA standalone.
    window.mcvWarmupKeyboard = function () {
      var hiddenInput = document.createElement('input');
      hiddenInput.setAttribute('type', 'text');
      hiddenInput.setAttribute(
        'style',
        'position:fixed; top:-1000px; left:-1000px; opacity:0; height:1px; width:1px; pointer-events:none;'
      );
      document.body.appendChild(hiddenInput);
      hiddenInput.focus();

      setTimeout(function () {
        hiddenInput.blur();
        document.body.removeChild(hiddenInput);
      }, 50);
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
