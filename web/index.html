<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Viewport : indispensable, absent avant -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mcv">
  <link rel="apple-touch-icon" href="icons/mcv_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/mcv_logo.png"/>

  <title>My Collection of Vinyles</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background-color: #000000; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function forceRelayout() {
      // Force un VRAI recalcul (pas juste un event) : on change
      // réellement une dimension, puis on la restaure au frame suivant.
      var vh = window.innerHeight;
      document.documentElement.style.height = (vh - 1) + 'px';
      requestAnimationFrame(function () {
        document.documentElement.style.height = vh + 'px';
        window.dispatchEvent(new Event('resize'));
      });
    }

    window.addEventListener('load', function () {
      setTimeout(forceRelayout, 300);
      setTimeout(forceRelayout, 1000);
    });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        forceRelayout();
      }
    });

    // visualViewport est souvent plus fiable que window pour les PWA iOS
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', forceRelayout);
    }
  </script>
</body>
</html>
