<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mcv">
  <link rel="apple-touch-icon" href="icons/mcv_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/mcv_logo.png"/>

  <title>My Collection of Vinyles</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fond noir dès le premier paint, évite le flash blanc au chargement */
    html, body {
      background-color: #000000;
      height: 100%;
      width: 100%;
      /* Empêche tout scroll fantôme du document englobant en mode
         standalone iOS, qui causait un décalage constant entre
         l'endroit cliqué et l'endroit où le clic était détecté.
         Flutter gère lui-même son propre scroll interne, donc
         bloquer le scroll du document HTML ne casse rien côté app. */
      overflow: hidden;
      position: fixed;
    }
  </style>
</head>
<body>
  <script>
    // Recale le document à l'origine au chargement, au cas où un
    // scroll fantôme existerait déjà avant même l'interaction —
    // filet de sécurité en plus du CSS ci-dessus.
    window.addEventListener('load', function () {
      window.scrollTo(0, 0);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
