<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mcv">
  <link rel="apple-touch-icon" href="icons/mcv_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/mcv_logo.png"/>

  <title>My Collection of Vinyles</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #000000;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }
  </style>
</head>
<body>
  <script>
    window.addEventListener('load', function () {
      window.scrollTo(0, 0);
    });

    // FIX PRINCIPAL : en PWA standalone iOS, Flutter calcule mal les
    // coordonnées de hit-test (clic décalé vers le bas) tant qu'un VRAI
    // cycle ouverture/fermeture du clavier n'a pas eu lieu au moins une
    // fois. Un simple `resize` déclenché en JS ne suffit pas car il ne
    // change aucune vraie valeur de window.innerHeight/visualViewport.
    //
    // Ici, on force ce vrai cycle automatiquement au tout premier tap
    // de l'utilisateur (obligatoire : iOS n'ouvre le clavier via JS que
    // dans un vrai geste utilisateur, pas au chargement de la page).
    //
    // Effet secondaire visible : le clavier système peut flasher
    // brièvement à l'écran lors de ce tout premier tap.
    (function () {
      var warmedUp = false;

      function warmUpViewportMetrics() {
        if (warmedUp) return;
        warmedUp = true;

        var hiddenInput = document.createElement('input');
        hiddenInput.setAttribute('type', 'text');
        hiddenInput.setAttribute(
          'style',
          'position:fixed; top:-1000px; left:-1000px; opacity:0; height:1px; width:1px; pointer-events:none;'
        );
        document.body.appendChild(hiddenInput);
        hiddenInput.focus();

        setTimeout(function () {
          hiddenInput.blur();
          document.body.removeChild(hiddenInput);
        }, 50);
      }

      document.addEventListener('touchend', warmUpViewportMetrics, {
        once: true,
        passive: true,
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
