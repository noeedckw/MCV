<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Viewport -->
  <meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mcv">
  <link rel="apple-touch-icon" href="icons/mcv_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/mcv_logo.png"/>

  <title>My Collection of Vinyles</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #000000;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }
  </style>
</head>
<body>
  <script>
    window.addEventListener('load', function () {
      window.scrollTo(0, 0);
    });

    // FIX (invisible) : force WebKit à recalculer ses métriques de
    // viewport en perturbant légèrement puis en restaurant le meta
    // "viewport", sans ouvrir de clavier ni provoquer de saut visuel.
    // C'est un correctif heuristique pour un bug connu où Flutter web
    // calcule mal les coordonnées de hit-test au lancement en PWA
    // standalone iOS.
    window.addEventListener('load', function () {
      setTimeout(function () {
        var viewport = document.getElementById('viewport-meta');
        if (!viewport) return;

        var original = viewport.getAttribute('content');
        // Change minime (échelle max légèrement différente), invisible
        // à l'oeil, mais suffisante pour forcer WebKit à recalculer.
        var tweaked = original.replace('maximum-scale=1', 'maximum-scale=1.001');

        viewport.setAttribute('content', tweaked);
        requestAnimationFrame(function () {
          viewport.setAttribute('content', original);
          window.dispatchEvent(new Event('resize'));
        });
      }, 300);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
